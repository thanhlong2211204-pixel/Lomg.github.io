<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lomg ♡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">
  <div class="loader-box">
    <div class="loader-avatar"><img src="avatar.jpg.jpg" alt=""></div>
    <div class="loader-name">Lomg</div>
    <div class="loader-bar"><span></span></div>
    <div class="loader-text">loading...</div>
  </div>
</div>

<div class="background">
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="background.mp4.mp4" type="video/mp4">
  </video>
  <div class="fallback"></div>
  <div class="overlay"></div>
  <div class="stars"></div>
</div>

<audio id="bgMusic" src="music.mp3.mp3" loop preload="auto"></audio>
<button id="soundBtn" class="sound-btn" title="Bật / tắt nhạc">🔇</button>
<div id="cursorGlow"></div>
<div id="particles"></div>

<main class="profile">
  <div class="avatar-wrap">
    <div class="ring"></div>
    <img class="avatar" src="avatar.jpg.jpg" alt="Lomg">
  </div>

  <h1>Lomg</h1>
  <p class="description">Je te donnerai mon cœur et mon corps</p>

  <section class="card">
    <img src="avatar.jpg.jpg" alt="">
    <div class="user-info">
      <strong>Lomg <span>♡</span></strong>
      <small>last seen 2 hours ago</small>
    </div>
    <div class="heart">♡</div>
    <div class="online"></div>
  </section>

  <nav class="socials">
    <a class="facebook" href="https://www.facebook.com/boysytinhhetminhyeuem/" target="_blank" rel="noopener noreferrer" title="Facebook">f</a>
    <a class="instagram" href="https://www.instagram.com/_22_th11/" target="_blank" rel="noopener noreferrer" title="Instagram">◎</a>
  </nav>

  <div class="views">◉ 2,636</div>
</main>

<script src="script.js"></script>
</body>
</html>
